<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JanDrishti · Every complaint gets a deadline</title>
    <meta name="description" content="File any civic complaint, see the officer and deadline, and watch missed deadlines move up to the senior officer automatically. Proof photos are checked before a case can close." />
    <meta name="theme-color" content="#FFC21A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Tiro+Devanagari+Hindi&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint: saved choice, else the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem('jd:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
